<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  @property --n { syntax:"<integer>"; inherits:false; initial-value:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#0b1220; }
  .stage { position:absolute; inset:0; background:radial-gradient(70% 60% at 50% 30%,#1e3a8a,#0b1220 70%); overflow:hidden; }
  .ease { animation-timing-function:cubic-bezier(.2,.8,.2,1); animation-fill-mode:both; }
  .brand { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:200px; animation:brand 1.2s cubic-bezier(.7,0,.2,1) 2.4s both; }
  .brand .logo { font-size:1em; }
  .brand .ch { display:inline-block; animation:up .7s cubic-bezier(.2,.8,.2,1) both; }
  .brand svg { animation:pop .6s cubic-bezier(.3,1.6,.5,1) 1s both; transform-origin:50% 100%; }
  .sub { position:absolute; left:0; right:0; top:640px; text-align:center; color:#93c5fd; font-size:30px; animation:fadeup .8s cubic-bezier(.2,.8,.2,1) 1.3s both, out .5s 2.4s forwards; }
  .title { position:absolute; left:0; right:0; top:120px; text-align:center; color:#fff; font-size:72px; font-weight:600; letter-spacing:-.035em; animation:fadeup .9s cubic-bezier(.2,.8,.2,1) 3.1s both; }
  .title em { font-family:"Instrument Serif"; font-weight:400; color:#4ade80; }
  .device { position:absolute; left:50%; top:300px; width:1500px; margin-left:-750px; border-radius:24px; overflow:hidden; box-shadow:0 60px 120px -40px #000; animation:rise 1.4s cubic-bezier(.2,.8,.2,1) 3.4s both; }
  .device .scale { transform:scale(1.0417); }
  .kpi b { counter-reset:n var(--n); } .kpi b::after { content:counter(n); }
  .kpi b.c1 { animation:c1 1.6s cubic-bezier(.2,.8,.2,1) 4.4s both; } .kpi b.c2 { animation:c2 1.6s cubic-bezier(.2,.8,.2,1) 4.5s both; }
  .kpi b.c3 { animation:c3 1.6s cubic-bezier(.2,.8,.2,1) 4.6s both; } .kpi b.c4 { animation:c4 1.6s cubic-bezier(.2,.8,.2,1) 4.7s both; }
  .line { stroke-dasharray:1; animation:draw 2s cubic-bezier(.4,0,.2,1) 4.6s both; }
  .area path:not(.line), .area circle { animation:fade 1s 5.8s both; }
  .donut circle + circle { animation:fade .8s 5s both; }
  .g4 .card { animation:fadeup .7s cubic-bezier(.2,.8,.2,1) both; }
  .g4 .card:nth-child(1) { animation-delay:4.1s } .g4 .card:nth-child(2) { animation-delay:4.2s } .g4 .card:nth-child(3) { animation-delay:4.3s } .g4 .card:nth-child(4) { animation-delay:4.4s }
  table tr { animation:fadeup .6s cubic-bezier(.2,.8,.2,1) both; } table tr:nth-child(1){animation-delay:6.2s} table tr:nth-child(2){animation-delay:6.35s} table tr:nth-child(3){animation-delay:6.5s} table tr:nth-child(4){animation-delay:6.65s}
  .end { position:absolute; inset:0; background:#0b1220; display:grid; place-items:center; text-align:center; animation:fade .7s 7.6s both; }
  .end .logo { font-size:120px; } .end p { color:#94a3b8; font-size:28px; margin-top:24px; }
  @keyframes up { from { transform:translateY(80px); opacity:0 } }
  @keyframes pop { from { transform:translateX(-50%) scale(0) } }
  @keyframes brand { to { top:-200px; opacity:0 } }
  @keyframes fadeup { from { transform:translateY(40px); opacity:0 } }
  @keyframes rise { from { transform:translateY(500px) scale(.92); opacity:0 } }
  @keyframes out { to { opacity:0 } } @keyframes fade { from { opacity:0 } }
  @keyframes draw { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
  @keyframes c1 { to { --n:3912 } } @keyframes c2 { to { --n:486 } } @keyframes c3 { to { --n:248 } } @keyframes c4 { to { --n:31 } }
</style></head><body><div class="stage">
  <div class="brand" id="brand"></div>
  <p class="sub">Saiba de onde vêm seus contatos do WhatsApp</p>
  <h1 class="title">Cada contato, com a <em>origem</em> certa.</h1>
  <div class="device fit" id="dev" style="height:938px"></div>
  <div class="end"><div><span id="endlogo"></span><p>Botão e formulário de WhatsApp + CRM · pinaskit.vercel.app</p></div></div>
</div>
<script src="mocks.js"></script>
<script>
  brand.innerHTML = LOGO("#fff", "#60a5fa");
  // anima cada letra do nome
  const lg = brand.querySelector(".logo"); let k = 0;
  lg.childNodes.forEach((n) => { if (n.nodeType === 3) { const s = document.createElement("span"); s.innerHTML = [...n.textContent].map((c) => `<span class="ch" style="animation-delay:${0.1 + k++ * 0.07}s">${c}</span>`).join(""); n.replaceWith(s); } });
  lg.querySelector(".i").classList.add("ch"); lg.querySelector(".i").style.animationDelay = "0.17s";
  lg.querySelector("em").classList.add("ch"); lg.querySelector("em").style.animationDelay = "0.6s";
  dev.innerHTML = `<div class="scale">${dashboard()}</div>`;
  dev.querySelectorAll(".kpi b").forEach((b, i) => { b.textContent = ""; b.classList.add("c" + (i + 1)); });
  dev.querySelectorAll(".line").forEach((p) => p.setAttribute("pathLength", "1"));
  endlogo.innerHTML = LOGO("#fff", "#60a5fa");
</script></body></html>
